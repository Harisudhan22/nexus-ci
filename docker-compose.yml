version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexus-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexus_ci
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.12.0-community
    container_name: nexus-neo4j
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
      - neo4j_import:/var/lib/neo4j/import

  api:
    build: ./backend
    container_name: nexus-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/nexus_ci
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - JWT_SECRET=dev-jwt-secret-key-for-nexus-ci-hackathon-2026
      - UPLOAD_DIR=/workspace/uploads
      - LLM_PROVIDER=openai
      - OPENAI_API_KEY=""
      - GROQ_API_KEY=""
    depends_on:
      - postgres
      - neo4j
    volumes:
      - uploads_data:/workspace/uploads

  web:
    image: node:18-alpine
    container_name: nexus-web
    restart: always
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - API_URL=http://api:8000/api
      - NODE_ENV=development
    command: sh -c "npm install -g pnpm && pnpm install && pnpm dev"
    depends_on:
      - api

volumes:
  postgres_data:
  neo4j_data:
  neo4j_import:
  uploads_data:
